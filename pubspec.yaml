name: flutter_network_core
description: >
  Cross-platform Dio network layer for Flutter — HTTP methods, connectivity,
  timeouts, queued access/refresh tokens, and typed exceptions.
version: 0.1.0
homepage: https://github.com/ghanashyambehera/flutter_network_core
topics:
  - dio
  - network
  - http
  - interceptor
  - authentication

environment:
  sdk: ^3.10.8
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.4
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
